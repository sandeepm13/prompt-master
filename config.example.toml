# =====================================================================
#  Master Prompt - settings
#  After editing: right-click the tray icon > "Reload config".
#  Lines starting with # are comments (ignored).
# =====================================================================

[behavior]
default_style = "enhance"   # enhance | coding | concise | detailed | (your own style)
timeout_seconds = 30        # per provider
paste_restore_delay_ms = 600  # wait after Ctrl+V before your clipboard is put back
read_chat_messages = true   # use your recent messages: visible ones in AI chats; Claude Code, Codex or Copilot Chat sessions in an IDE

[hotkeys]
regenerate = "ctrl+alt+p"   # same as clicking the dot and Yes, in any app. "" turns it off. e.g. "ctrl+shift+space", "win+alt+p"

# ---------------------------------------------------------------------
#  AI providers - tried top to bottom. If one fails (limit reached,
#  offline, error), the next one is used automatically.
#
#  The first launch asks only for an API key and detects the service from it.
#  Any OpenAI-compatible service works when the key identifies it.
#  Groq and Gemini below are the examples used when those keys are recognized.
#  You can also set a Windows environment variable and restart:
#               setx GROQ_API_KEY "gsk_..."
#               setx GEMINI_API_KEY "AIza..."
# ---------------------------------------------------------------------

[[providers]]
name = "groq"
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"         # other options: openai/gpt-oss-20b (faster), qwen/qwen3.8-27b
api_key = ""
api_key_env = "GROQ_API_KEY"
temperature = 0.3
extra_params = { reasoning_effort = "low" }   # gpt-oss thinks first; "low" = faster

[[providers]]
name = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.5-flash"            # see https://ai.google.dev/gemini-api/docs/models
api_key = ""
api_key_env = "GEMINI_API_KEY"
temperature = 0.3

# Want more backups? Uncomment one of these.
#
# [[providers]]
# name = "openrouter"
# base_url = "https://openrouter.ai/api/v1"
# model = "anthropic/claude-sonnet-4.5"
# api_key_env = "OPENROUTER_API_KEY"
#
# [[providers]]                        # runs on your own PC, works offline
# name = "ollama"
# base_url = "http://localhost:11434/v1"
# model = "llama3.2"

[apps]
# The dot does nothing in these apps, because Ctrl+C there means "stop the running command".
blocked = ["WindowsTerminal.exe", "cmd.exe", "powershell.exe", "pwsh.exe", "conhost.exe", "wsl.exe", "mintty.exe"]

